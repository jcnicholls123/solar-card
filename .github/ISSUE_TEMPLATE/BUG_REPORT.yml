name: Bug report
description: File a Solar Card bug report.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this Solar Card bug report. Please provide the details below.
  - type: input
    id: summary
    attributes:
      label: Short summary
      description: A short summary of the bug.
      placeholder: The card shows the wrong weather animation.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Detailed description
      description: Include steps to reproduce, expected behavior, and actual behavior.
      placeholder: Describe the bug in detail.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The Solar Card version where the bug appears.
      placeholder: v1.0.0-beta.2
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Card configuration
      description: Your card YAML configuration.
      render: yaml
      placeholder: |
        type: custom:solar-card
        location_source: default
        language: en
        daylight_hours_entity: sensor.daylight_hours
        weather_entity: weather.home
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, and Home Assistant version.
      placeholder: Chrome on Windows 11, Home Assistant 2026.5
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Any relevant logs or screenshots that can help identify the issue.
      placeholder: Paste logs or upload screenshots.
    validations:
      required: false
